name: Build APK and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (cached)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (caches dependencies, wrapper, build outputs)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      - name: Prepare release keystore
        shell: bash
        run: |
          DEVEL_PASS="clipboardmemory"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias clipboardmemory \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$DEVEL_PASS" -keypass "$DEVEL_PASS" \
              -dname "CN=Clipboard Memory, OU=Dev, O=ClipboardMemory, L=City, S=State, C=US"
          fi
          if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "KEYSTORE_PASSWORD=$DEVEL_PASS" >> $GITHUB_ENV
          fi

      - name: Build debug & release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-memory-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-memory-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true